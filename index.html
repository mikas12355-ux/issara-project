/* تنعيم تكيّفي: يثبّت المفاصل عند السكون ولا يؤخر الحركة السريعة */
function smoothHands(res){
  const out=[],used=[0,0];
  (res.landmarks||[]).forEach((h,i)=>{
    let s=res.handedness?.[i]?.[0]?.categoryName==="Left"?0:1;if(used[s])s=1-s;used[s]=1;const p=PV[s];
    const n=!p?h.map(q=>({x:q.x,y:q.y,z:q.z})):h.map((q,j)=>{const a=Math.min(.95,.3+Math.hypot(q.x-p[j].x,q.y-p[j].y)*14);return{x:p[j].x+(q.x-p[j].x)*a,y:p[j].y+(q.y-p[j].y)*a,z:p[j].z+(q.z-p[j].z)*a}});
    PV[s]=n;out.push({s,p:n});
  });
  [0,1].forEach(s=>{if(!used[s])PV[s]=null});return out;
}
/* متجه الإطار: لكل يد 66 قيمة = شكل الأصابع والمفاصل (نسبةً للمعصم وحجم الكف) + موضع المعصم + حضور اليد */
function vec(hands){
  const f=new Float32Array(132);
  hands.forEach(({s,p})=>{const o=s*66,w=p[0],sc=Math.hypot(p[9].x-w.x,p[9].y-w.y)||1;
    p.forEach((q,j)=>{f[o+j*3]=(q.x-w.x)/sc;f[o+j*3+1]=(q.y-w.y)/sc;f[o+j*3+2]=(q.z-w.z)/sc});
    f[o+63]=w.x;f[o+64]=w.y;f[o+65]=1});
  return f;
}
/* تسلسل زمني ثابت الطول (16 إطارًا) غير حساس لمكان اليد في الصورة؛ يحتفظ بمسار الحركة وسرعتها */
function prep(fr){
  fr=fr.filter(f=>f[65]||f[131]);if(fr.length<4)return null;
  const m=[0,0,0,0,0,0];
  fr.forEach(f=>[0,1].forEach(s=>{if(f[s*66+65]){m[s*3]+=f[s*66+63];m[s*3+1]+=f[s*66+64];m[s*3+2]++}}));
  return Array.from({length:16},(_,i)=>{
    const f=Float32Array.from(fr[Math.round(i*(fr.length-1)/15)]);
    [0,1].forEach(s=>{const o=s*66;if(f[o+65]){f[o+63]=(f[o+63]-m[s*3]/m[s*3+2])*3;f[o+64]=(f[o+64]-m[s*3+1]/m[s*3+2])*3;f[o+65]=2}});
    return f;
  });
}
/* مرآة: يعرّف الإشارة سواء استخدم المستخدم اليد اليمنى أو اليسرى */
const mir=q=>q.map(f=>{const g=new Float32Array(132);[0,1].forEach(s=>{const o=s*66,d=(1-s)*66;for(let j=0;j<66;j++){let v=f[o+j];if((j<63&&j%3===0)||j===63)v=-v;g[d+j]=v}});return g});
const dist=(a,b)=>{let s=0;for(let i=0;i<16;i++){let e=0;const x=a[i],y=b[i];for(let k=0;k<132;k++){const d=x[k]-y[k];e+=d*d}s+=Math.sqrt(e/132)}return s/16};
function classify(q){
  const ext=window.issaraModel?.classify?.(q);if(ext?.length)return ext; /* ربط نموذج مدرّب خارجي: [{w,type,c}] */
  const m=mir(q),best={};
  S.sigs.forEach(s=>{const d=Math.min(dist(q,s.seq),dist(m,s.seq));if(!best[s.word]||d<best[s.word].d)best[s.word]={w:s.word,type:s.type,d}});
  return Object.values(best).sort((a,b)=>a.d-b.d).slice(0,3).map(x=>({...x,c:1/(1+Math.exp((x.d-.38)/.07))}));
}
/* تقطيع الإشارات: تبدأ بظهور اليد وتنتهي بغيابها أو بثباتها، دون الاعتماد على صورة واحدة */
let seg=[],lastSeen=0,stillSince=0,lock=false,prevW=null,spell=[],spellTimer=0,msgTimer=0;
function step(hands){
  const now=performance.now();
  if(S.rec){if(S.rec.on)S.rec.f.push(vec(hands));return}
  if(!S.run)return;
  if(hands.length){
    lastSeen=now;const w=hands[0].p[0],sp=prevW?Math.hypot(w.x-prevW.x,w.y-prevW.y):1;prevW=w;
    if(sp>.006){stillSince=now;lock=false}
    if(lock)return;seg.push(vec(hands));if(seg.length>150)seg.shift();
    if(seg.length>=10&&now-stillSince>650){finalize(seg);seg=[];lock=true}
  }else{
    prevW=null;if(seg.length&&now-lastSeen>450){if(seg.length>=6)finalize(seg);seg=[]}
    lock=false;stillSince=now;
  }
}
function flash(k){S.msg=k;showMsg();clearTimeout(msgTimer);msgTimer=setTimeout(()=>{S.msg="";showMsg()},3500)}
function finalize(frames){
  const q=prep(frames);if(!q)return;
  if(!S.sigs.length&&!window.issaraModel)return flash("nosamples");
  const r=classify(q),top=r[0];
  if(top&&top.c>=.65&&(!r[1]||r[1].d-top.d>.04)){S.cand=null;addWord(top.w,top.type)}   /* تثبيت بعتبة ثقة وهامش عن المنافس */
  else if(top&&top.c>=.3){S.cand=r.filter(x=>x.c>=.2);showCand()}                    /* أكثر من احتمال: يختار المستخدم */
  else flash("unclear");                                                                /* لا كلمة عشوائية أبدًا */
}
const SP=new Set(["LETTER","NUMBER"]);
function flushSpell(){if(spell.length){S.words.push(spell.join(""));spell=[]}}
function addWord(w,type){
  clearTimeout(spellTimer);S.cand=null;
  if(SP.has(type)){spell.push(w);spellTimer=setTimeout(()=>{flushSpell();syncText()},1800)}else{flushSpell();S.words.push(w)}
  syncText();showCand();
}
/* ============ تصحيح النص العربي (قواعد محافظة: لا تغيّر المعنى ولا تضيف معلومات) ============ */
const FIX={"انا":"أنا","احتاج":"أحتاج","مساعده":"مساعدة","الى":"إلى","اني":"أني","ان":"أن","اذا":"إذا","اريد":"أريد","ارجو":"أرجو","اشعر":"أشعر","استاذ":"أستاذ","الاستاذ":"الأستاذ","ايضا":"أيضًا","الان":"الآن","مدرسه":"مدرسة","المدرسه":"المدرسة","جامعه":"جامعة","الجامعه":"الجامعة","لفظيا":"لفظيًا","جسديا":"جسديًا","الكترونيا":"إلكترونيًا","شكرا":"شكرًا","خايف":"خائف","اعتدى":"اعتدى"};
function correct(ws){
  const o=[];ws.forEach(w=>{w=FIX[w]||w;if(w!==o[o.length-1]||w==="،"||w===".")o.push(w)});
  let s="",glue=false;
  o.forEach(w=>{if(w==="،"||w==="."||w==="؟"){s+=w;return}s+=(s&&!glue?" ":"")+w;glue=w==="و"});
  s=s.replace(/\s+/g," ").trim();if(s&&!/[.؟!]$/.test(s))s+=".";return s;
}
function syncText(){S.text=correct(spell.length?[...S.words,spell.join("")]:S.words);const o=$("#out");if(o&&document.activeElement!==o)o.textContent=S.text}

async function openCam(){

  try{if(!stream)stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:540},frameRate:{ideal:60}},audio:false})}
  catch{S.status="camerr";upSt();return}
  S.cam=true;renderCam();const v=$("#v");v.srcObject=stream;await v.play().catch(()=>{});
  if(!lm){S.status="loadingModel";upSt();try{await initLm("GPU")}catch{try{await initLm("CPU")}catch{S.status="modelerr";upSt();return}}}
  S.status="idle";upSt();cancelAnimationFrame(raf);loop();
}
function loop(){
  raf=requestAnimationFrame(loop);const v=$("#v"),c=$("#c");
  if(!v||!c||!lm||v.readyState<2||v.currentTime===lastT)return;lastT=v.currentTime;
  const hands=smoothHands(lm.detectForVideo(v,performance.now()));step(hands);
  const x=c.getContext("2d");c.width=v.videoWidth;c.height=v.videoHeight;x.clearRect(0,0,c.width,c.height);if(!S.track)return;
  hands.forEach(({p})=>{x.lineWidth=2.5;x.strokeStyle="rgba(241,235,224,.85)";x.shadowColor="#c2a15a";x.shadowBlur=10;
    CONN.forEach(([a,b])=>{x.beginPath();x.moveTo(p[a].x*c.width,p[a].y*c.height);x.lineTo(p[b].x*c.width,p[b].y*c.height);x.stroke()});
    x.shadowBlur=0;p.forEach((q,i)=>{x.beginPath();x.arc(q.x*c.width,q.y*c.height,i%4===0&&i?5:3.5,0,7);x.fillStyle=i%4===0&&i?"#c2a15a":"#f1ebe0";x.fill()})});
}

 const adm=S.me.role==="org"||S.me.role==="admin";
 const header=`<div class="page-head"><div>${adm?`<span class="tag">${t("admin")}</span>`:""}<h2>${t(adm?"adminTitle":"reportsTitle")}</h2><p>${t(adm?"adminDesc":"reportsDesc")}</p></div>${adm?`<div>${t("reportCount")}: <b class="tag">${S.reports.length}</b></div>`:`<button class="pri" data-p="newrep">+ ${t("newReport")}</button>`}</div>`;
 if(adm)return `<section class="page-panel">${header}<div class="admin-scroll"><table class="admin-table"><thead><tr>${["reportNumber","reporterName","orgGrade","kind","reportBody","reportDate","currentStatus","adminAction"].map(k=>`<th>${t(k)}</th>`).join("")}</tr></thead><tbody>${S.reports.map(r=>`<tr><td><b>#${r.id}</b></td><td>${esc(r.reporter?.name||"—")}</td><td>${orgN(r.org)}${r.reporter?.school?` / ${esc(r.reporter.school)}`:""}${r.reporter?.grade?` / ${esc(r.reporter.grade)}`:""}</td><td>${kindN(r.kind)}</td><td class="excerpt">${esc(r.text.slice(0,140))}</td><td>${fmt(r.created)}</td><td>${stTag(r.status)}</td><td><button class="pri" data-o="${r.id}">${t("edit")} / ${t("setStatus")}</button></td></tr>`).join("")||`<tr><td colspan="8">${t("none")}</td></tr>`}</tbody></table></div></section>`;
 const legend=`<div class="legend"><div class="red"><b>🔴 ${t("redTitle")}</b><small>${t("redDesc")}</small></div><div class="yellow"><b>🟡 ${t("yellowTitle")}</b><small>${t("yellowDesc")}</small></div><div class="green"><b>🟢 ${t("greenTitle")}</b><small>${t("greenDesc")}</small></div></div>`;
 return `<section class="page-panel">${header}${legend}${S.reports.length?S.reports.map(r=>`<div class="item rep rep-entry ${ST[r.status][0]}" data-o="${r.id}"><div class="rep-top"><b style="color:var(--gold)">#${r.id} · ${kindN(r.kind)}</b>${stTag(r.status)}</div><p>${esc(r.text)}</p><div class="reply"><b>${t("adminReply")}: </b>${esc(r.lastReply||t("noReply"))}<small style="float:inline-end">${fmt(r.created)}</small></div></div>`).join(""):`<p class="note">${t("none")}</p>`}</section>`;
}
function repDetail(){
  const r=S.rep,adm=S.me.role==="org";
  return `<button data-p="${adm?"admin":"reports"}">← ${t("back")}</button><h2 style="margin-top:1rem">#${r.id}</h2><div class="item rep ${ST[r.status][0]}" style="max-width:760px">
  ${stTag(r.status)} <small>· ${orgN(r.org)} · ${fmt(r.created)}</small>
  ${r.kind.length?`<p class="note">${t("kind")}: ${kindN(r.kind)}</p>`:""}<p style="font-size:1.15rem;margin:.6rem 0">${esc(r.text)}</p>${r.details?`<p class="note">${esc(r.details)}</p>`:""}
  ${adm&&r.reporter?`<p class="note">${t("reporter")}: ${esc(r.reporter.name)} · ${esc(r.reporter.email)} · ${age(r.reporter.dob)} ${t("years")}</p>`:""}
  ${(r.attach||[]).map(a=>`<img src="${esc(a)}" style="max-width:100%;max-height:260px;border-radius:10px;margin:.4rem 0">`).join("")}
  <h3 class="g" style="margin-top:1rem">${t("reports")}</h3>${r.msgs.map(m=>`<div class="msg ${m.kind==="note"?"note":""}"><b>${m.kind==="note"?"🔒 "+t("note"):m.who==="org"?t("fromOrg"):t("fromUser")}</b> · <small>${fmt(m.created)}</small><br>${esc(m.text)}</div>`).join("")}
  <textarea id="rp" placeholder="${t("reply")}"></textarea>
  ${adm?`<textarea id="nt2" placeholder="${t("note")}" style="min-height:60px;margin-top:.5rem"></textarea><label style="margin-top:.6rem">${t("setStatus")}<select id="ns">${Object.keys(ST).filter(k=>k!=="new").map(k=>`<option value="${k}" ${k===r.status?"selected":""}>${L2(ST[k])}</option>`).join("")}</select></label>`:""}
  <div class="err" id="re"></div><button class="pri" id="rsb" style="margin-top:.7rem">${adm?t("save"):t("send")}</button></div>`;
}
function newRep(){
 return `<div class="center"><form class="form report-form" id="nf"><h1>${t("reportTitle")}</h1><p class="note">${t("reportIntro")}</p><label>${t("kind")}<span class="row">${["physical","verbal","cyber","social","other"].map(k=>`<label class="chk"><input type="checkbox" name="k" value="${k}">${t(k)}</label>`).join("")}</span></label><label>${t("recipient")}<select id="og">${ORGS.map(o=>`<option value="${o[0]}">${L2(o)}</option>`).join("")}</select></label><label>${t("reportText")}<textarea id="rt" required>${esc(S.text)}</textarea></label><label>${t("details")}<textarea id="dt"></textarea></label><label>${t("evidence")}<input id="ev" type="file" accept="image/*" multiple></label><div class="err" id="ne"></div><div class="row"><button type="button" data-p="home">${t("back")}</button><button class="pri">${t("sendRep")}</button></div></form></div>`;
}
function acct(){
 const u=S.me, user=u.role==="user";
 return `<div class="profile-wrap"><section class="page-panel"><div class="page-head profile-top"><div><h2>${t("profileTitle")}</h2><p>${t("profileDesc")}</p></div></div><form id="ef" class="form" style="width:100%;background:transparent;border:0;padding:0"><div class="profile-fields"><label>${t("name")}<input id="nm" value="${esc(u.name)}" required></label><label>${t("email")}<input id="em" type="email" value="${esc(u.email||"")}" required autocomplete="email"></label>${user?`<label>${t("school")}<input id="school" value="${esc(u.school||"")}"></label><label>${t("grade")}<input id="grade" value="${esc(u.grade||"")}"></label><label>${t("dob")}<input id="db" type="date" value="${esc(u.dob||"")}" required></label><label>${t("gender")}<span class="radio"><label><input type="radio" name="g" value="m" ${u.gender!=="f"?"checked":""}>${t("male")}</label><label><input type="radio" name="g" value="f" ${u.gender==="f"?"checked":""}>${t("female")}</label></span></label>`:`<label>${t("org")}<input disabled value="${orgN(u.org)}"></label>`}</div><div class="err" id="ae"></div><div class="row"><button class="pri" type="submit">${t("save")}</button><button type="button" id="lo">${t("logout")}</button></div></form></section></div>`;
}
function view(){
  if(!S.me)return authView();
  if(S.page==="newrep")return nav()+newRep();
  const p=S.page;
  return nav()+`<main>${p==="home"?home():p==="dict"&&S.me.role==="admin"?dictPage():p==="reports"||p==="admin"?repsPage():p==="rep"&&S.rep?repDetail():acct()}</main>`;
}
async function go(p,id){
  if(p==="dict"&&S.me?.role!=="admin")return go("home");
  if(p==="admin"&&!["admin","org"].includes(S.me?.role))return go("home");
  if(p!=="home"&&S.cam)stopCam();
  S.page=p;S.err="";
  try{
    if(p==="reports"||p==="admin")S.reports=(await api("/reports")).reports;
    if(p==="rep")S.rep=(await api("/reports/"+id)).report;
    if(p==="dict"||p==="home")S.sigs=(await api("/signs")).signs;
  }catch(e){if(!S.me)return}
  render();
}
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.documentElement.dataset.theme=S.theme;
  $("#app").innerHTML=view();bind();
}
/* ============ الأحداث ============ */
function logout(silent){if(!silent)api("/logout","POST").catch(()=>{});S.tok=null;S.me=null;localStorage.removeItem("tok");stopCam();S.page="home";S.text="";S.words=[];render()}
function bind(){
  const lg=$("#lg");if(lg)lg.onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";localStorage.setItem("l",JSON.stringify(S.lang));render()};
  if(!S.me)return bindAuth();
  const th=$("#th");if(th)th.onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";localStorage.setItem("t",JSON.stringify(S.theme));render()};
  $$("[data-p]").forEach(b=>b.onclick=()=>go(b.dataset.p));
  $$("[data-o]").forEach(b=>b.onclick=()=>go("rep",b.dataset.o));
  const lo=$("#lo");if(lo)lo.onclick=()=>logout();
  if(S.page==="home")bindHome();
  if(S.page==="dict"&&S.me.role==="admin")bindDict();
  if(S.page==="rep")bindRep();
  if(S.page==="newrep")bindNew();
  if(S.page==="account"){
    const ef=$("#ef");if(ef)ef.onsubmit=async e=>{e.preventDefault();try{const b={name:$("#nm").value,email:$("#em").value.trim().toLowerCase(),lang:S.lang};if(S.me.role==="user")Object.assign(b,{dob:$("#db").value,gender:document.querySelector("[name=g]:checked").value,school:$("#school").value,grade:$("#grade").value});S.me=(await api("/me","PUT",b)).user;render()}catch(x){$("#ae").textContent=x.message}};
  }
}
function bindAuth(){
  const f=$("#f");if(!f)return;
  const sw=$("#sw");if(sw)sw.onclick=()=>{S.auth=S.auth==="login"?"register":"login";S.err="";render()};
  f.onsubmit=async e=>{e.preventDefault();S.err="";
    try{
      const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;
      if(S.auth==="register"){
        const r=await api("/register","POST",{name:$("#nm").value,email:em,password:pw,dob:$("#db").value,gender:document.querySelector("[name=g]:checked").value,lang:S.lang});
        return enter(r);
      }
      enter(await api("/login","POST",{email:em,password:pw}));
    }catch(x){S.err=x.message;render()}
  };
}
async function enter(r){S.tok=r.token;localStorage.setItem("tok",JSON.stringify(r.token));S.me=r.user;S.auth="login";await boot(true)}
function bindHome(){
  const o=$("#open");if(o)o.onclick=openCam;
  if(S.cam){bindCam();const v=$("#v");if(v&&stream){v.srcObject=stream;v.play().catch(()=>{})}}
  const out=$("#out");out.oninput=()=>{S.text=out.textContent;S.words=S.text.replace(/[.،؟]/g," $& ").split(/\s+/).filter(Boolean).filter(w=>w!==".")};
  $("#cl").onclick=()=>{S.text="";S.words=[];spell=[];out.textContent=""};
  $("#cp").onclick=()=>navigator.clipboard?.writeText(out.textContent);
  $("#sp").onclick=()=>{const u=new SpeechSynthesisUtterance(out.textContent);u.lang=S.lang==="ar"?"ar-SA":"en-US";speechSynthesis.speak(u)};
  $("#cm").onclick=()=>{S.words.push("،");syncText()};$("#pd").onclick=()=>{S.words.push(".");syncText()};
  $("#sr").onclick=()=>{S.text=out.textContent.trim();if(S.text){if(S.cam)stopCam();S.page="newrep";render()}};
  const rg=$("#rg");if(rg){rg.onclick=startRec;$("#rd").onclick=()=>{S.rec=null;render();if(stream)openCam()}}
  showCand();showMsg();
}
function bindDict(){
  const rerender=()=>{const q=$("#q"),v=q.value;$("main").innerHTML=dictPage(v);bindDict();const n=$("#q");n.focus();n.setSelectionRange(v.length,v.length)};
  $("#q").oninput=rerender;
  $$("[data-r]").forEach(b=>b.onclick=()=>{S.rec={word:b.dataset.r,type:b.dataset.ty,n:0,f:[],on:false};S.page="home";render();openCam()});
  $$("[data-x]").forEach(b=>b.onclick=async()=>{await api("/signs/delete","POST",{word:b.dataset.x});S.sigs=S.sigs.filter(s=>s.word!==b.dataset.x);rerender()});
  $("#na").onclick=()=>{const w=$("#nw").value.trim();if(!w)return;S.rec={word:w,type:$("#nt").value,n:0,f:[],on:false};S.page="home";render();openCam()};
}
function bindRep(){
  $("#rsb").onclick=async()=>{
    const adm=S.me.role==="org"||S.me.role==="admin",rep=$("#rp").value.trim();
    try{
      if(adm)await api(`/reports/${S.rep.id}/update`,"POST",{reply:rep,note:$("#nt2").value,status:$("#ns").value});
      else{if(!rep)return;await api(`/reports/${S.rep.id}/reply`,"POST",{text:rep})}
      go("rep",S.rep.id);
    }catch(e){$("#re").textContent=e.message}
  };
}
function bindNew(){
  $("#nf").onsubmit=async e=>{
    e.preventDefault();const files=[...$("#ev").files].slice(0,3),at=[];
    for(const f of files){if(f.size>1.4e6){$("#ne").textContent="الصورة أكبر من 1.4MB";return}at.push(await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)}))}
    try{
      const r=await api("/reports","POST",{text:$("#rt").value,org:$("#og").value,kind:$$("[name=k]:checked").map(x=>x.value),details:$("#dt").value,attach:at});
      S.text="";S.words=[];alert(t("sent")+" #"+r.id);go("rep",r.id);
    }catch(x){$("#ne").textContent=x.message}
  };
}
/* ============ الإقلاع ============ */
async function boot(keep){
  
  if(S.tok&&!S.me){try{S.me=(await api("/me")).user}catch{}}
  if(S.me){
    const m=location.hash.match(/^#\/report\/(\d+)/);
    return m?go("rep",m[1]):go(S.me.role==="org"||S.me.role==="admin"?"admin":"home");
  }
  render();
}
boot();
</script>
</body>
</html>
